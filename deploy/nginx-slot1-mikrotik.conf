# Nginx do servidor (proxy reverso com TLS) → container "web" em 127.0.0.1:8080.
# Se o Nginx estiver em outra máquina, troque 127.0.0.1 pelo IP do servidor Docker e
# publique o container com WEB_BIND=<IP do servidor> no .env.
# Copie para /etc/nginx/sites-available/, ajuste server_name/certificados e ative.

# Opcional: limite de requisições ao login (complementa o limite da aplicação)
limit_req_zone $binary_remote_addr zone=slot1_login:10m rate=10r/m;

server {
    listen 80;
    server_name mikrotik.slot1.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name mikrotik.slot1.com.br;

    ssl_certificate     /etc/letsencrypt/live/mikrotik.slot1.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mikrotik.slot1.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Recomendado: restringir a origem (rede da empresa / VPN de acesso).
    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;

    client_max_body_size 1m;

    location = /api/auth/login {
        limit_req zone=slot1_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/slot1-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/slot1-proxy.conf;
    }
}

