# Servidor interno do container "web": entrega a SPA e encaminha /api ao backend.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # Fotos das ordens de serviço (já reduzidas no navegador). O backend limita cada rota.
    client_max_body_size 15m;

    # IP real do cliente: aceito do X-Forwarded-For só quando quem conecta é um proxy de rede
    # privada (o Nginx com TLS, no host ou na rede local). O valor que o cliente inventa no
    # cabeçalho é ignorado, porque a busca para no primeiro endereço não confiável (da direita
    # para a esquerda). Assim o limite de tentativas de login e a auditoria usam o IP verdadeiro.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Cabeçalhos de segurança (repetidos em cada location que usa add_header, pois o Nginx
    # não herda add_header do server quando a location define o seu).
    include /etc/nginx/snippets/security-headers.conf;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        # Um único IP, já resolvido acima: o backend não recebe a lista que o cliente pode forjar.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 30d;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
